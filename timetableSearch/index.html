<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timetables · somlight.dev</title>

    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="style.css">
    <script src="/layout.js"></script>
</head>
<body>
<main>
    <div id="app">
        <aside id="sidebar" class="panel">
            <form id="schoolForm">
                <label for="schoolUrl" data-translation-id="tt.urlLabel">your school's timetable link</label>
                <div class="inputRow">
                    <input type="text" id="schoolUrl" placeholder="szkola.pl/planlekcji" autocomplete="off">
                    <button type="submit" class="btn" data-translation-id="tt.load">load</button>
                </div>
                <p class="hint" data-translation-id="tt.hint">Open your school's timetable and paste its link here. Works with VULCAN Optivum timetables.</p>
            </form>

            <div class="inputRow" id="savedRow">
                <select id="schoolSelect" aria-label="saved schools"></select>
                <button type="button" class="btn ghost" id="refreshBtn" data-translation-id="tt.refresh">refresh</button>
            </div>

            <p id="infoBox" aria-live="polite"></p>

            <h3 data-translation-id="tt.classes">classes</h3>
            <div id="classList"></div>
        </aside>

        <section id="content" class="panel">
            <h2 id="classTitle"></h2>
            <div id="tableCon">
                <p class="hint" data-translation-id="tt.pick">Pick a class on the left.</p>
            </div>
        </section>
    </div>

    <p class="disclaimer" data-translation-id="tt.disclaimer">Not an official product. Not affiliated with any school or with VULCAN.</p>
    <p class="disclaimer" data-translation-id="tt.soonInfo">New advanced search feature coming soon!</p>
</main>

<noscript>This page needs JavaScript to work.</noscript>
<script src="strings.js"></script>
<script src="script.js"></script>
</body>
</html>
